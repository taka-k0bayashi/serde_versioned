[package]
name = "serde_versioned"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "A Rust library for handling versioned serialization and deserialization with backward compatibility support"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/serde_versioned"
keywords = ["serde", "serialization", "versioning", "compatibility", "deserialization"]
categories.workspace = true
readme.workspace = true

[dependencies]
serde_versioned_derive = { path = "../serde_versioned_derive", version = "0.3.1" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"