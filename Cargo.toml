[workspace]
members = ["serde_versioned", "serde_versioned_derive"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Takahiro Kobayashi <takahiro1209work@gmail.com>"]
license = "MIT"
repository = "https://github.com/taka-k0bayashi/serde_versioned"
homepage = "https://github.com/taka-k0bayashi/serde_versioned"
categories = ["encoding"]
readme = "README.md"

[package]
name = "serde_versioned_tests"
edition.workspace = true
publish = false

[dev-dependencies]
serde_versioned = { path = "serde_versioned" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
serde_yaml_ng = "0.10"
