[package]
name = "serde_versioned_derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Procedural macro for serde_versioned library"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/serde_versioned_derive"
keywords = ["serde", "serialization", "versioning", "proc-macro", "derive"]
categories.workspace = true
readme.workspace = true

[lib]
name = "serde_versioned_derive"
proc-macro = true

[dependencies]
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
serde_versioned = { path = "../serde_versioned" }
serde = { version = "1.0", features = ["derive"] }